name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded finite checks and clean scientific comparison
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p scientific-output
          timeout --signal=TERM --kill-after=10s 420s bash -euo pipefail <<'CHECKS'
          ulimit -t 390
          ulimit -v 2097152
          run() {
            label="$1"
            shift
            "$@" >"scientific-output/${label}.stdout.log" 2>"scientific-output/${label}.stderr.log"
          }
          run unit-tests python -B -m unittest discover -s tests -v
          run general python -B run.py --output scientific-output/general
          run general-replay python -B run.py --output scientific-output/general --check-only
          run timeline python -B run_timeline.py --output scientific-output/timeline
          run timeline-replay python -B run_timeline.py --output scientific-output/timeline --check-only
          run anchors python -B run_anchor.py --output scientific-output/anchors
          run anchors-replay python -B run_anchor.py --output scientific-output/anchors --check-only
          run exhaustive python -B run_exhaustive.py --output scientific-output/exhaustive
          run exhaustive-replay python -B run_exhaustive.py --output scientific-output/exhaustive --check-only
          run bibliography python -B run_bibliography.py --output scientific-output/bibliography
          run retained-bibliography python -B run_bibliography.py --check-only
          run clean-comparison python -B reproduce.py
          CHECKS
      - name: Preserve raw outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-outputs
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
